name: Set up Node, Bun and the dependencies
description: The versions of .nvmrc and package.json, then bun install.
inputs:
  bun-from-npm:
    description: Install Bun with npm. The Playwright image has no unzip, which oven-sh/setup-bun needs.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
    - if: inputs.bun-from-npm != 'true'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json
    - if: inputs.bun-from-npm == 'true'
      shell: bash
      run: npm install --global "bun@$(node -p "require('./package.json').packageManager.split('@')[1]")"
    - run: bun install --frozen-lockfile
      shell: bash
