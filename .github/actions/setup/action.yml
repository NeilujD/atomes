name: Set up Node, Bun and the dependencies
description: The versions of .nvmrc and package.json, then bun install.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json
    - run: bun install --frozen-lockfile
      shell: bash
