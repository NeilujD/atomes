name: Install the Playwright browsers
description: Chromium and WebKit from the cache, then their system packages.
runs:
  using: composite
  steps:
    - name: Playwright version
      id: playwright
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    - name: Cache the Playwright browsers
      id: browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - name: Install the browsers and their system packages
      if: steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      run: bunx playwright install --with-deps chromium webkit
    # The cache holds the browsers, not the system packages they need.
    - name: Install the system packages of the browsers
      if: steps.browsers.outputs.cache-hit == 'true'
      shell: bash
      run: bunx playwright install-deps chromium webkit
