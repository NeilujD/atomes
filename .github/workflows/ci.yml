name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  # E2E journeys in Chromium and WebKit (CORE-73). Advisory: `protect-main`
  # requires only `check`. Make this job required once the suite is stable.
  # Playwright starts the dev server with throwaway settings made at run time
  # (playwright.config.ts): no secret.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the browsers and their system packages
        if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium webkit
      # The cache holds the browsers, not the system packages they need.
      - name: Install the system packages of the browsers
        if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium webkit
      - run: bun run test:e2e
      - name: Keep the Playwright traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t atomes:ci .
      - name: The image stops at start when a required setting is missing
        run: |
          if docker run --rm atomes:ci; then echo "The image started with no settings"; exit 1; fi
      # Throwaway settings, made for this run only: no secret in the repo or in CI.
      - name: Run the image and wait for its health check
        run: |
          docker run -d --name atomes -v atomes-data:/data \
            -e ALLOWED_DIDS=did:plc:ci -e SESSION_ENCRYPTION_KEY="$(openssl rand -base64 32)" atomes:ci
          for _ in $(seq 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' atomes)
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs atomes
          exit 1
      - name: The backup command loads in the image and asks for its settings
        run: |
          if out=$(docker run --rm atomes:ci node dist/backup.mjs backup 2>&1); then exit 1; fi
          echo "$out"
          echo "$out" | grep -q 'missing settings: BACKUP_S3_ENDPOINT'
