name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Each task on its own runner, at the same time. The `check` job below gives
  # their result under the name `protect-main` requires.
  verify:
    strategy:
      fail-fast: false
      matrix:
        task: [check, lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun run ${{ matrix.task }}

  check:
    needs: verify
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          VERIFY: ${{ needs.verify.result }}
        run: test "$VERIFY" = success

  # E2E journeys in Chromium and WebKit (CORE-73), on 8 runners at the same time:
  # one dev server serves 2 workers well, not more. Playwright starts the dev
  # server with throwaway settings made at run time (playwright.config.ts): no secret.
  e2e-shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/browsers
      - run: bunx playwright test --shard=${{ matrix.shard }}/8
      - name: Keep the Playwright traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  # A new or changed spec runs once more with each page script 300 ms late,
  # so a tap before a script has run fails here, before the merge (CLAUDE.md,
  # `bun run test:e2e`). Not --repeat-each: the copies of a test share one
  # reader (e2e/readers.ts) and change each other's Library.
  e2e-slow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit and its first parent (the base): the changed specs.
          fetch-depth: 2
      - name: Find the changed specs
        id: specs
        run: |
          specs=$(git diff --name-only --diff-filter=AMR HEAD^1 HEAD -- 'e2e/*.spec.ts' | tr '\n' ' ')
          echo "${specs:-No changed spec}"
          echo "specs=$specs" >> "$GITHUB_OUTPUT"
      - if: steps.specs.outputs.specs != ''
        uses: ./.github/actions/setup
      - if: steps.specs.outputs.specs != ''
        uses: ./.github/actions/browsers
      - name: Run the changed specs again with slow scripts
        if: steps.specs.outputs.specs != ''
        env:
          SPECS: ${{ steps.specs.outputs.specs }}
        # One argument for each spec: $SPECS is split on purpose.
        run: |
          # shellcheck disable=SC2086
          E2E_SLOW_SCRIPTS=300 bunx playwright test $SPECS
      - name: Keep the Playwright traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-slow
          path: test-results/
          retention-days: 14

  # The result of the E2E jobs under the name `protect-main` requires.
  e2e:
    needs: [e2e-shard, e2e-slow]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          SHARDS: ${{ needs.e2e-shard.result }}
          SLOW: ${{ needs.e2e-slow.result }}
        run: |
          test "$SHARDS" = success
          [ "$SLOW" = success ] || [ "$SLOW" = skipped ]

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t atomes:ci .
      - name: The image stops at start when a required setting is missing
        run: |
          if docker run --rm atomes:ci; then echo "The image started with no settings"; exit 1; fi
      # Throwaway settings, made for this run only: no secret in the repo or in CI.
      # No SMTP server listens there: the health check sends no mail.
      - name: Run the image and wait for its health check
        run: |
          docker run -d --name atomes -v atomes-data:/data \
            -e SESSION_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            -e SMTP_URL=smtp://127.0.0.1:2525 -e MAIL_FROM=atomes@example.org atomes:ci
          for _ in $(seq 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' atomes)
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs atomes
          exit 1
      - name: The backup command loads in the image and asks for its settings
        run: |
          if out=$(docker run --rm atomes:ci node dist/backup.mjs backup 2>&1); then exit 1; fi
          echo "$out"
          echo "$out" | grep -q 'missing settings: BACKUP_S3_ENDPOINT'
