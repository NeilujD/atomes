name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t atomes:ci .
      - name: Run the image and wait for its health check
        run: |
          docker run -d --name atomes -v atomes-data:/data atomes:ci
          for _ in $(seq 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' atomes)
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs atomes
          exit 1
      - name: The backup command loads in the image and asks for its settings
        run: |
          if out=$(docker run --rm atomes:ci node dist/backup.mjs backup 2>&1); then exit 1; fi
          echo "$out"
          echo "$out" | grep -q 'missing settings: BACKUP_S3_ENDPOINT'
